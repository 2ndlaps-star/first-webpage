name: Deploy to GitHub Pages

on:
  # Run on pushes to the main branch and the current working branch.
  push:
    branches:
      - main
      - claude/first-webpage-github-push-mIKjk
  # Allow running this workflow manually from the Actions tab.
  workflow_dispatch:

# Permissions needed to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Automatically enable GitHub Pages if it isn't already.
          enablement: true

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the whole repository root (where index.html lives).
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
